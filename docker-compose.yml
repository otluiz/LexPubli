# LexPubli — stack de desenvolvimento e do spike.
#
#   cp .env.example .env    # e preencha
#   docker compose up -d --build       # o broker-init configura o RabbitMQ sozinho
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py carregar_exemplo
#   docker compose exec web python manage.py createsuperuser
#
# Broker: PRÓPRIO do LexPubli (ADR-0005 §2a). O LexPubli não usa o broker do
# LexLearn nem tem credencial dele. O LexCorpus entra na rede `lexpubli-broker`
# (overlay docker-compose.lexpubli.yml de lá) e usa o host `lexpubli-rabbitmq`,
# nunca `rabbitmq`, que na rede do LexLearn é o broker de lá.
name: lexpubli

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://lexpubli:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/lexpubli
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:${LEXPUBLI_PORT:-8190}:8000"   # só localhost; exposição pública é decisão de produção
    volumes:
      - media:/data/media
    deploy:
      resources:
        limits: {cpus: "2", memory: 768M}

  worker:
    <<: *app
    command: ["python", "manage.py", "publicar_eventos", "--loop", "5"]
    environment:
      DATABASE_URL: postgres://lexpubli:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/lexpubli
      LEXPUBLI_RABBITMQ_URL: amqp://lexpubli:${BROKER_LEXPUBLI_PASSWORD:?defina BROKER_LEXPUBLI_PASSWORD no .env}@lexpubli-rabbitmq:5672/lexpubli
    networks: [default, broker]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: lexpubli
      POSTGRES_USER: lexpubli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexpubli -d lexpubli"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}

  # Monitor de fontes (Discovery). UI em http://127.0.0.1:5000
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.9
    profiles: ["discovery"]
    ports:
      - "127.0.0.1:${CHANGEDETECTION_PORT:-5000}:5000"
    volumes:
      - changedetection:/datastore
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}

  # Broker próprio (ADR-0005 §2a): vhost `lexpubli`, sem o usuário guest.
  # O administrador só serve à gestão e ao broker-init; o worker e o LexCorpus
  # usam usuários de permissão mínima (configurar_broker).
  rabbitmq:
    image: rabbitmq:3.13.7-management
    hostname: lexpubli-rabbitmq      # o nome do nó; os dados no volume dependem dele
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?defina RABBITMQ_DEFAULT_USER no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?defina RABBITMQ_DEFAULT_PASS no .env}
      RABBITMQ_DEFAULT_VHOST: lexpubli
    ports:
      - "127.0.0.1:${BROKER_GESTAO_PORT:-15673}:15672"   # UI de gestão, só localhost
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks:
      broker:
        aliases: [lexpubli-rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 12
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}

  # Cria o vhost e os usuários lexpubli e lexcorpus (idempotente) e sai.
  broker-init:
    build: .
    env_file: .env
    command: ["python", "manage.py", "configurar_broker"]
    environment:
      LEXPUBLI_BROKER_API: http://lexpubli-rabbitmq:15672/api
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [broker]
    restart: "no"

volumes:
  pgdata:
  media:
  changedetection:
  rabbitmq:

networks:
  # Nome fixo: o LexCorpus entra nela como rede externa.
  broker:
    name: lexpubli-broker
