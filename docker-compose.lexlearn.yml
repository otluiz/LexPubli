# docker-compose.lexlearn.yml — ponte para o broker do LexLearn.
#
# Use SEMPRE por último:
#   docker compose -f docker-compose.yml -f docker-compose.lexlearn.yml up -d
#
# Só o worker entra na rede do LexLearn (é ele que fala com o RabbitMQ). O
# portal e o PostgreSQL ficam na rede própria do LexPubli: o banco do
# LexPubli não é visível para a stack do LexLearn, e vice-versa.
services:
  worker:
    networks: [default, lexlearn]

networks:
  lexlearn:
    name: lexlearn-v3_default
    external: true
